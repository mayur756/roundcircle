<!DOCTYPE html>
<html>
<head>
<style>
    .main-box {
        width: 650px;
        height: 600px;
        background: orange;
        position: relative;
    }

    #circle {
        width: 75px;
        height: 75px;
        background: black;
        border-radius: 50%;
        position: absolute;
        left: 10px;
        top: 10px;
        transition: 0.5s ease;
    }
</style>
</head>

<body>

<div class="main-box">
    <div id="circle" onclick="moveCircle()"></div>
</div>

<script>
let step = 0;

function moveCircle() {
    const circle = document.getElementById("circle");

    if (step === 0) {
        circle.style.left = "570px"; 
        step = 1;
    }
    else if (step === 1) {
        circle.style.top = "525px"; 
        step = 2;
    }
    else if (step === 2) {
        circle.style.left = "4px"; 
        step = 3;
    }
    else if (step === 3) {
        circle.style.top = "5px"; 
        step = 0;
    }
}
</script>
</body>
</html>
